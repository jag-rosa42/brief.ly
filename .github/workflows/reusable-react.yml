# .github/workflows/reusable-react.yml
name: React CI

on:
  workflow_call: # called by ci.yml
    inputs:
      working-directory:
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # run every check
      matrix:
        include:
          - name: lint
            npm_script: lint
          - name: typecheck
            npm_script: typecheck
          - name: tests
            npm_script: test
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }} # run in the frontend
    steps:
      - name: checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: setup node
        uses: ./.github/actions/setup-node
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: run ${{ matrix.name }}
        run: npm run ${{ matrix.npm_script }}
