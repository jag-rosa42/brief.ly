# .github/workflows/reusable-react.yml
name: React CI

on:
  workflow_call: # called by ci.yml
    inputs:
      working-directory:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }} # run in the frontend
    steps:
      - name: checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: setup node
        uses: ./.github/actions/setup-node
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: check lint
        run: npm run lint
      - name: check types
        run: npm run typecheck
      - name: run tests
        run: npm run test
