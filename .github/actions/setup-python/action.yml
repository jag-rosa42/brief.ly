# .github/actions/setup-python/action.yml
name: 'Setup Python'
description: 'Install Python + deps with cache'
inputs:
  working-directory:
    required: true
  python-version:
    default: '3.14'
runs:
  using: composite # run inside the caller job
  steps:
    - name: setup python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: install uv
      run: python -m pip install --disable-pip-version-check uv==0.12.1 # pin uv
      shell: bash
    - name: install locked dependencies
      run: python -m uv sync --locked --all-groups # exact dev dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
