# ==============================================================================
# Reusable each service's image build
# ==============================================================================

# Ai-processing
x-ai-processing-dev-image-build: &ai-processing-dev-image-build
  build:
    dockerfile: Dockerfile.dev
  volumes:
    - ./srcs/services/ai-processing:/app/srcs/services/ai-processing
    - ./shared/packages/shared_errors:/app/shared/packages/shared_errors

# Content-management
x-content-management-dev-image-build: &content-management-dev-image-build
  build:
    dockerfile: Dockerfile.dev
  volumes:
    - ./srcs/services/content-management:/app/srcs/services/content-management
    - ./shared/packages/shared_errors:/app/shared/packages/shared_errors

# Identity
x-identity-dev-image-build: &identity-dev-image-build
  build:
    dockerfile: Dockerfile.dev
  volumes:
    - ./srcs/services/identity:/app/srcs/services/identity
    - ./shared/packages/shared_errors:/app/shared/packages/shared_errors

# Morning-briefing
x-morning-briefing-dev-image-build: &morning-briefing-dev-image-build
  build:
    dockerfile: Dockerfile.dev
  volumes:
    - ./srcs/services/morning-briefing:/app/srcs/services/morning-briefing
    - ./shared/packages/shared_errors:/app/shared/packages/shared_errors
    - ./shared/packages/shared_auth:/app/shared/packages/shared_auth

# Personalization
x-personalization-dev-image-build: &personalization-dev-image-build
  build:
    dockerfile: Dockerfile.dev
  volumes:
    - ./srcs/services/personalization:/app/srcs/services/personalization
    - ./shared/packages/shared_errors:/app/shared/packages/shared_errors
    - ./shared/packages/shared_auth:/app/shared/packages/shared_auth


# ==============================================================================
#      Services
# ==============================================================================

services:
  frontend:
    build:
      context: ./srcs/frontend/
      dockerfile: Dockerfile.dev
    image: front-react-ts
    container_name: frontend-dev
    pull_policy: build
    # No published port: Vite (5173) is reached through the gateway, like
    # nginx in production (srcs/gateway/dev/frontend.yaml).
    volumes:
      - ./srcs/frontend/:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
      # The browser opens the hot reload WebSocket on the gateway, over TLS.
      VITE_HMR_HOST: localhost
      VITE_HMR_PROTOCOL: wss
      VITE_HMR_CLIENT_PORT: ${GATEWAY_HTTPS_PORT:?Variable not set}

  # Same gateway as production; only the frontend service file changes:
  # Vite on 5173 instead of nginx on 8080. srcs/gateway/dev/ is our folder,
  # not a Traefik convention: Traefik only reads /etc/traefik/dynamic/, so we
  # mount dev/frontend.yaml over the production file at that path.
  gateway:
    restart: "no"
    volumes:
      - ./srcs/gateway/dev/frontend.yaml:/etc/traefik/dynamic/frontend.yaml:ro

  # Grafana is the only monitoring UI published in development. Normally Docker
  # binds it to 127.0.0.1 on this computer. In the project VM, the Makefile sets
  # DEV_BIND_ADDRESS=0.0.0.0, so Docker listens on every IPv4 interface inside
  # the guest; QEMU separately forwards only host 127.0.0.1 to the guest port.
  # Other VM network modes could also reach the guest's all-interface binding.
  grafana:
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"

  front-test:
    build:
      context: ./srcs/frontend/
      dockerfile: Dockerfile.dev
    network_mode: none
    volumes:
      - ./srcs/frontend/:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "test", "--", "--watch"]
    profiles:
      - front-test

  adminer:
    image: docker.io/library/adminer:6.1.1
    container_name: adminer
    restart: "no"
    depends_on:
      pgsql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    environment:
      ADMINER_DESIGN: pepa-linha-dark
    networks: [backend]
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${ADMINER_PORT:?Variable not set}:8080"
    profiles:
      - databases

  # The development exception of ADR-0006: the databases and Adminer are
  # published, because `make test`, `make run` and the migration commands run
  # on the host. DEV_BIND_ADDRESS keeps them on this machine (127.0.0.1).
  # The VM targets set it to 0.0.0.0: QEMU forwards to the guest's network
  # address, not its loopback, and QEMU itself listens on the host's
  # 127.0.0.1 only.
  pgsql:
    restart: "no"
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:?Variable not set}:5432"

  pgvector:
    restart: "no"
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${AI_POSTGRES_PORT:?Variable not set}:5432"


  # Ai-processing
  prestart-ai-processing:
    <<: *ai-processing-dev-image-build

  ai-processing:
    <<: *ai-processing-dev-image-build
    restart: "no"
    environment:
      # Used by Uvicorn/watchfiles for backend --reload, independently of Vite.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-false}

  # Content-management
  prestart-content-management:
    <<: *content-management-dev-image-build

  content-management:
    <<: *content-management-dev-image-build
    restart: "no"
    environment:
      # Used by Uvicorn/watchfiles for backend --reload, independently of Vite.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-false}

  # Identity
  prestart-identity:
    <<: *identity-dev-image-build

  identity:
    <<: *identity-dev-image-build
    restart: "no"
    environment:
      # Used by Uvicorn/watchfiles for backend --reload, independently of Vite.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-false}

  # Morning-briefing
  prestart-morning-briefing:
    <<: *morning-briefing-dev-image-build

  morning-briefing:
    <<: *morning-briefing-dev-image-build
    restart: "no"
    environment:
      # Used by Uvicorn/watchfiles for backend --reload, independently of Vite.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-false}

  # Personalization
  prestart-personalization:
    <<: *personalization-dev-image-build

  personalization:
    <<: *personalization-dev-image-build
    restart: "no"
    environment:
      # Used by Uvicorn/watchfiles for backend --reload, independently of Vite.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-false}

volumes:
  frontend_node_modules:
