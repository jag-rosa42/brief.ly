# ==============================================================================
# The routing table
# ------------------------------------------------------------------------------
# Three kinds of routers live here:
#
# 1. Services: an allowlist. A request reaches a service only if its router
#    lists the resource (docs/api/<service>.md, "Caller path" column), not the
#    whole /api/<service> prefix: with a whole prefix,
#    /api/identity/internal/... would reach Identity as /internal/... once the
#    prefix is stripped. So a service's /internal, /health, /metrics, /docs and
#    /openapi.json are never reachable from outside. Any other /api or /public
#    path matches no router and gets Traefik's own 404.
#
# 2. Public API (ADR-0009): an allowlist too, under /public/v1, one router per
#    service. The path is NOT stripped: services serve /public/v1/... as is.
#    Every request goes through the same chain (public-api-chain), in this
#    order:
#      0. public-rate-limit-info: every answer tells the program its limits
#           (X-RateLimit-* headers).
#      a. public-rate-limit-ip:  too many requests from one IP  -> 429
#      b. public-rate-limit-key: too many requests with one key -> 429
#      c. public-forward-auth:
#           Traefik asks Identity whether the X-API-Key is valid.
#           - yes: Identity answers 200 with a 60 s token in Authorization,
#             which Traefik puts in the forwarded request (the "phantom
#             token");
#           - no:  Identity's 401 goes back to the program.
#      d. public-strip-api-key:  the key has done its job; the services get
#           only the token, never the key.
#    The documentation (/public/v1/docs and /public/v1/openapi/...) has its
#    own routers: per-IP limit only, no key needed.
#
# 3. Frontend: a catch-all, on purpose. The SPA's routes are client-side
#    (React Router), its assets have hashed names, and Vite serves its own
#    paths in development, so they can't be listed. Everything outside /api
#    and /public goes to the frontend container (nginx in production, Vite in
#    development), which only serves the SPA's static files. A path like
#    /health or /internal/x therefore gets the SPA (index.html, then its "not
#    found" page), never a service.
#
# Adding a frontend route: add its resource to the service's rule, and to
# docs/api/<service>.md. Adding a public route: the same, in the service's
# public router (the chain comes with the router).
# ==============================================================================

http:
  routers:
    # Login and registration: the same service as identity below, plus a rate
    # limit per IP against password guessing (auth-rate-limit). The priority
    # makes this router win over identity: by default a router's priority is
    # the length of its rule, and identity's is the longest, over 200.
    identity-auth-limited:
      entrypoints: [websecure]
      priority: 1000
      rule: >-
        Path(`/api/identity/auth/login`) ||
        Path(`/api/identity/auth/register`)
      middlewares: [auth-rate-limit, strip-identity-prefix]
      service: identity

    identity:
      entrypoints: [websecure]
      rule: >-
        Path(`/api/identity/auth`) ||
        PathPrefix(`/api/identity/auth/`) ||
        Path(`/api/identity/accounts`) ||
        PathPrefix(`/api/identity/accounts/`) ||
        Path(`/api/identity/api-keys`) ||
        PathPrefix(`/api/identity/api-keys/`)
      middlewares: [strip-identity-prefix]
      service: identity

    personalization:
      entrypoints: [websecure]
      rule: >-
        Path(`/api/personalization/me`) ||
        PathPrefix(`/api/personalization/me/`) ||
        Path(`/api/personalization/topics`) ||
        PathPrefix(`/api/personalization/topics/`)
      middlewares: [strip-personalization-prefix]
      service: personalization

    morning-briefing:
      entrypoints: [websecure]
      rule: >-
        Path(`/api/morning-briefing/briefing`) ||
        PathPrefix(`/api/morning-briefing/briefing/`)
      middlewares: [strip-morning-briefing-prefix]
      service: morning-briefing

    # --------------------------------------------------------------------------
    # Public API
    # --------------------------------------------------------------------------
    personalization-public:
      entrypoints: [websecure]
      rule: >-
        Path(`/public/v1/topics`) ||
        Path(`/public/v1/me/profile`) ||
        Path(`/public/v1/me/saved-articles`) ||
        PathPrefix(`/public/v1/me/saved-articles/`)
      middlewares: [public-api-chain]
      service: personalization

    morning-briefing-public:
      entrypoints: [websecure]
      rule: >-
        Path(`/public/v1/morning-briefing`)
      middlewares: [public-api-chain]
      service: morning-briefing

    # The documentation: readable without a key, so no ForwardAuth.
    # Personalization hosts the page and its own document; each other service
    # serves its own document.
    personalization-public-docs:
      entrypoints: [websecure]
      rule: >-
        Path(`/public/v1/docs`) ||
        Path(`/public/v1/openapi/personalization.json`)
      middlewares: [public-rate-limit-ip]
      service: personalization

    morning-briefing-public-docs:
      entrypoints: [websecure]
      rule: >-
        Path(`/public/v1/openapi/morning-briefing.json`)
      middlewares: [public-rate-limit-ip]
      service: morning-briefing

    # --------------------------------------------------------------------------
    # Frontend
    # --------------------------------------------------------------------------
    frontend:
      entrypoints: [websecure]
      # Catch-all, not an allowlist: see the header.
      rule: >-
        !(Path(`/api`) || PathPrefix(`/api/`) ||
        Path(`/public`) || PathPrefix(`/public/`))
      service: frontend

  middlewares:
    # --- Security headers, on every answer (traefik.yaml, websecure) ---------
    # Not here, on purpose:
    # - Strict-Transport-Security: the host is localhost, and a browser applies
    #   HSTS to the host, not the port, so it would force HTTPS on Vite
    #   (http://localhost:5173) and Adminer (http://localhost:8086) too.
    # - Content-Security-Policy: Vite injects inline scripts in development,
    #   and /public/v1/docs loads Swagger UI from jsDelivr. A policy that
    #   allows both allows too much to be worth it.
    security-headers:
      headers:
        contentTypeNosniff: true                       # X-Content-Type-Options: nosniff
        frameDeny: true                                # X-Frame-Options: DENY
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"

    # --- Login and registration (identity-auth-limited) ----------------------
    # Per client IP: 10 attempts at once, then 1 every 6 seconds. Enough for a
    # person who mistypes, not for a program guessing passwords. Over the
    # limit, Traefik answers 429 itself, in plain text, with Retry-After. Like
    # the public limits below, it is in memory and resets with the gateway.
    auth-rate-limit:
      rateLimit:
        average: 10
        period: 1m
        burst: 10

    strip-identity-prefix:
      stripPrefix:
        prefixes: ["/api/identity"]
    strip-personalization-prefix:
      stripPrefix:
        prefixes: ["/api/personalization"]
    strip-morning-briefing-prefix:
      stripPrefix:
        prefixes: ["/api/morning-briefing"]

    # --- Public API chain (ADR-0009) -----------------------------------------
    # Every public router uses this one chain, so a new router can't skip a
    # step or change the order. Traefik runs the steps top to bottom.
    public-api-chain:
      chain:
        middlewares:
          - public-rate-limit-info
          - public-rate-limit-ip
          - public-rate-limit-key
          - public-forward-auth
          - public-strip-api-key

    # 0. Tell the program its limits, on every answer. First in the chain:
    # Traefik adds these headers to whatever comes back through it, so the
    # 429s of a. and b. and the 401 of c. carry them too, not only the
    # services' answers. The values are written by hand: keep them equal to
    # a. and b. below, and to shared_auth's documentation
    # (shared/packages/shared_auth/src/shared_auth/api/public_docs/responses.py).
    public-rate-limit-info:
      headers:
        customResponseHeaders:
          X-RateLimit-Limit-Per-Key: "5"
          X-RateLimit-Burst-Per-Key: "10"
          X-RateLimit-Limit-Per-IP: "20"
          X-RateLimit-Burst-Per-IP: "40"

    # Limits are in memory, per gateway: they reset when the gateway restarts
    # (one gateway, so that's fine; ADR-0009). Just over the limit, Traefik
    # holds the request a moment (at most 1 / (2 × average): 25 ms for the IP
    # limit, 100 ms for the key limit); beyond that, it answers 429 itself, in
    # plain text, with a Retry-After header.
    #
    # average = requests per second allowed over time;
    # burst = how many may arrive at once. Low enough to show a 429
    #         with a simple loop.
    #
    # Changing a value? Also change public-rate-limit-info above, and the
    # constants in shared_auth's public_docs/responses.py (the public docs).

    # a. Per client IP: protects the stack from one noisy machine, keys or not.
    public-rate-limit-ip:
      rateLimit:
        average: 20
        burst: 40
        period: 1s
        # No sourceCriterion: Traefik uses the connection's address. Not the
        # X-Forwarded-For header, which any client can write: nothing sits in
        # front of the gateway to set it.

    # b. Per API key: one program can't use the whole budget of the API.
    # Requests without the header all share one bucket (Traefik groups them
    # under an empty key); they get 401 from Identity anyway.
    public-rate-limit-key:
      rateLimit:
        average: 5
        burst: 10
        period: 1s
        sourceCriterion:
          requestHeaderName: X-API-Key

    # c. The phantom token exchange: Traefik calls Identity before forwarding.
    # Identity's verify route is internal: no router ever exposes it; Traefik
    # reaches it directly on the edge network, as an authentication server.
    public-forward-auth:
      forwardAuth:
        address: "http://identity:8000/internal/v1/api-keys/verify"
        # Send Identity only the key: never the program's cookies or other
        # headers, which Identity doesn't need.
        authRequestHeaders: ["X-API-Key"]
        # On 200, copy Identity's Authorization (Bearer <public API token>)
        # into the forwarded request. Traefik first deletes any Authorization
        # the program sent, so a program can't bring its own token.
        authResponseHeaders: ["Authorization"]

    # d. Drop the key before forwarding: the services need only the token
    # (ADR-0009, phantom token), so the long-lived key never reaches them or
    # their logs. It must come last: b and c still read the header. An empty
    # value tells Traefik to remove the header.
    public-strip-api-key:
      headers:
        customRequestHeaders:
          X-API-Key: ""

  services:
    identity:
      loadBalancer:
        servers:
          - url: "http://identity:8000" #uses the Docker Compose service name as the network destination
    personalization:
      loadBalancer:
        servers:
          - url: "http://personalization:8000" #uses the Docker Compose service name as the network destination
    morning-briefing:
      loadBalancer:
        servers:
          - url: "http://morning-briefing:8000" #uses the Docker Compose service name as the network destination

    # the frontend service is in frontend.yaml: it differs between production (nginx) and development (Vite)