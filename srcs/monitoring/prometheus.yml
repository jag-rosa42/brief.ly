global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["gateway:9092"]

  - job_name: pushgateway
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: identity
    static_configs:
      - targets: ["identity:8000"]

  - job_name: content-management
    static_configs:
      - targets: ["content-management:8000"]

  - job_name: personalization
    static_configs:
      - targets: ["personalization:8000"]

  - job_name: morning-briefing
    static_configs:
      - targets: ["morning-briefing:8000"]

  - job_name: ai-processing
    static_configs:
      - targets: ["ai-processing:8000"]
