apiVersion: 1
groups:
    - orgId: 1
      name: api-availability-1m
      folder: Observability
      interval: 1m
      rules:
        - uid: dg3zgszpnwidce
          title: API Target Down
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: up{job=~"identity|content-management|personalization|morning-briefing|ai-processing"}
                instant: true
                interval: ""
                intervalMs: 1000
                legendFormat: '{{job}}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            description: Prometheus can't collect from this API (up=0). Check the target and compose logs
            summary: API target {{ $labels.job }} unavailable since at least 5 minutes
          isPaused: false
