apiVersion: 1
groups:
  - orgId: 1
    name: gateway-availability-1m
    folder: Observability
    interval: 1m
    rules:
      - uid: gatewayhttpsprobe
        title: Gateway HTTPS Probe Failed
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: probe_success{job="gateway-probe",instance="gateway-https"}
              instant: true
              intervalMs: 1000
              legendFormat: gateway-https
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: HTTPS through the application gateway has failed for at least 5 minutes. Check the gateway, frontend, and TLS certificate.
          summary: Gateway HTTPS probe failed
        isPaused: false
