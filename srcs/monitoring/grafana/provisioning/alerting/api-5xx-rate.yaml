apiVersion: 1
groups:
    - orgId: 1
      name: api-5xx-rate-1m
      folder: Observability
      interval: 1m
      rules:
        - uid: api_5xx_rate
          title: API Elevated 5xx Rate
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) or on (service) (0 * sum by (service) (http_requests_total))
                instant: true
                interval: ""
                intervalMs: 1000
                legendFormat: '{{service}}'
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: More than 0.1 HTTP 5xx responses per second over a 5-minute window for at least 5 minutes. Check the service logs and request traffic.
            summary: Elevated 5xx rate for {{ $labels.service }}
          isPaused: false
