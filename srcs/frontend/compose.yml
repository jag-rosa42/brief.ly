services:
  front-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: front-react-ts
    ports:
      - "8080:8080"

  front-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app:Z # :Z is important on Fedora/SELinux.
      - frontend_node_modules:/app/node_modules

    develop:
      watch:
        - action: sync
          path: .
          target: /app

  front-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app:Z
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "test", "--", "--watch"]
    profiles:
      - front-test

volumes:
  frontend_node_modules:
