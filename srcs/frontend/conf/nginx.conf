worker_processes auto;

# Store PID in /tmp (always writable)
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Disable logging to avoid permission issues
    access_log off;
    error_log  /dev/stderr warn;

    # Optimize static file serving
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Gzip compression for optimized delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    server {
        listen       8080;
        server_name  localhost;

        # Behind the gateway, nginx only sees its internal port (8080). An
        # absolute redirect would send the browser to http://localhost:8080/...
        # Relative redirects keep the scheme and port the browser used
        # (https://localhost:8443).
        absolute_redirect off;

        # Root directory where React.js build files are placed
        root /usr/share/nginx/html;
        index index.html;

        # Client-side routing: any path that is not a file gets the SPA, and
        # React Router handles it in the browser. The gateway already sends
        # /api and /public elsewhere (srcs/gateway/dynamic/routers.yml).
        location / {
            try_files $uri /index.html;
        }

        # index.html names the current hashed bundles, so the browser must
        # check it on every load; otherwise a deploy keeps old bundles alive.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Vite's build output: file names contain a content hash, so a file
        # never changes and can be cached for a year. A missing file is a 404,
        # not index.html (which would be parsed as JavaScript and fail).
        # ^~ makes this prefix win over the regex location below.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Other static files (public/ folder: favicon, images...) keep their
        # names between deploys, so they get no long cache. Missing ones are a
        # 404 too, not the SPA.
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|map|json|txt)$ {
            try_files $uri =404;
        }
    }
}
