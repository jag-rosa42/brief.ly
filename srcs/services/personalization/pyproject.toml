# ============================================================================
# Project metadata
# ============================================================================

[project]
name = "Personalization"
version = "0.1.0"
description = "Personalization service"
readme = "README.md"
requires-python = ">=3.14"

# Runtime dependencies installed with the application.
dependencies = [
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.12.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

# ============================================================================
# Development dependencies
# ============================================================================

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",  # Test framework
    "ruff>=0.16.1",   # Linter and formatter
    "ty>=0.0.65",     # Static type checker
]

# ============================================================================
# FastAPI CLI
# ============================================================================

[tool.fastapi]
entrypoint = "src.main:app"


# ============================================================================
# Ruff
# ============================================================================

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "I",    # Import sorting
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
]

# Allow Ruff to automatically fix any fixable issue.
fixable = ["ALL"]

[tool.ruff.lint.isort]

# Treat imports from the local `src` package as first-party.
known-first-party = ["src"]


# ============================================================================
# ty
# ============================================================================

[tool.ty]

# No configuration required yet.
# Add options here if the project grows and needs them.


# ============================================================================
# pytest
# ============================================================================

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a real Postgres reachable at the configured DSN",
]
