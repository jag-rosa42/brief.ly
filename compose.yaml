# ---------------------------------------------------------------------------
  # How to add a backend service
  #
  # Add every new backend service in this order:
  #
  # 1. Production — this compose.yaml file
  #    - Create a top-level image-build anchor named
  #      `x-<service>-image-build`.
  #    - Set its production Dockerfile, build context, image name, and `.env`.
  #    - Add `prestart-<service>` when it needs database creation/migrations:
  #        <<: [*<service>-image-build, *backend-prestart]
  #    - Add `<service>`:
  #        <<: [*<service>-image-build, *backend-service]
  #    - Explicitly define its database dependency:
  #      `pgsql` for regular services, or `pgvector` for vector services.
  #    - Never publish a port: only the gateway does (ADR-0006).
  #    - If the browser calls it, add `networks: [edge, backend]` and its
  #      routes to srcs/gateway/dynamic/routers.yaml. Otherwise it stays on
  #      `backend` only (the anchor's default).
  #
  # 2. Development — compose.override.yaml
  #    - Create a top-level development image-build anchor named
  #      `x-<service>-dev-image-build`.
  #    - Use `Dockerfile.dev` and bind-mount the service source into `/app`.
  #    - Merge this anchor into both `prestart-<service>` and `<service>`.
  #    - Add `WATCHFILES_FORCE_POLLING` when the service uses Uvicorn reload.
  #
  # 3. macOS — compose.mac.yaml
  #    - Add `WATCHFILES_FORCE_POLLING: "true"` for the new service so source
  #      changes in the bind mount reliably trigger reloads.
  #
  # 4. Configuration
  #    - Add the host port used by `make run` to `.env.example`.
  #    - Create `<service>/.env.example` with its project/database settings.
  #    - Ensure its database name and migration setup are correct.
  # ---------------------------------------------------------------------------

# TODO: Fix the condition service_completed_successfully or use a VM for docker
name: "${DOMAIN}"

# ==============================================================================
# One-shot bootstrap: apply this service's migrations before the service starts.
# ==============================================================================

x-backend-prestart: &backend-prestart
  pull_policy: build
  restart: "no"
  profiles: [backend]
  environment:
    POSTGRES_HOST: pgsql
    POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
    POSTGRES_DEFAULT_DB_NAME: ${POSTGRES_DEFAULT_DB_NAME:?Variable not set}
  command:
    ["sh", "-c", "python -m src.infrastructure.database.bootstrap && alembic upgrade head"]
  secrets:
    - postgres_password
  networks:
    - backend
  depends_on:
    pgsql:
      condition: service_healthy

# ==============================================================================
# The service's backend container
# ==============================================================================

x-backend-service: &backend-service
  pull_policy: build
  restart: "always"
  profiles: [backend]
  environment:
    POSTGRES_HOST: pgsql
    POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
    POSTGRES_DEFAULT_DB_NAME: ${POSTGRES_DEFAULT_DB_NAME:?Variable not set}

  secrets:
    - postgres_password
  # Only on `backend` network: other services can call it but the gateway (on `edge` network only) can't even resolve its name.
  # Services the browser calls override the network with [edge, backend] (ADR-0006).
  networks:
    - backend
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 5s
    retries: 5

# ==============================================================================
# Reusable each service's image build
# ==============================================================================

# Ai-processing
x-ai-processing-image-build: &ai-processing-image-build
  container_name: ai-processing
  build:
    context: ./srcs/services/ai-processing
    dockerfile: Dockerfile
    additional_contexts:
      shared_errors: ./shared/packages/shared_errors
  image: ai-processing
  env_file:
    - ./srcs/services/ai-processing/.env

# Content-management
x-content-management-image-build: &content-management-image-build
  container_name: content-management
  build:
    context: ./srcs/services/content-management
    dockerfile: Dockerfile
    additional_contexts:
      shared_errors: ./shared/packages/shared_errors
  image: content-management
  env_file:
    - ./srcs/services/content-management/.env

# Identity
x-identity-image-build: &identity-image-build
  container_name: identity
  build:
    context: ./srcs/services/identity
    dockerfile: Dockerfile
    additional_contexts:
      shared_errors: ./shared/packages/shared_errors
  image: identity
  env_file:
    - ./srcs/services/identity/.env

# Morning-briefing
x-morning-briefing-image-build: &morning-briefing-image-build
  container_name: morning-briefing
  build:
    context: ./srcs/services/morning-briefing
    dockerfile: Dockerfile
    additional_contexts:
      shared_errors: ./shared/packages/shared_errors
      shared_auth: ./shared/packages/shared_auth
  image: morning-briefing
  env_file:
    - ./srcs/services/morning-briefing/.env

# Personalization
x-personalization-image-build: &personalization-image-build
  container_name: personalization
  build:
    context: ./srcs/services/personalization
    dockerfile: Dockerfile
    additional_contexts:
      shared_errors: ./shared/packages/shared_errors
      shared_auth: ./shared/packages/shared_auth
  image: personalization
  env_file:
    - ./srcs/services/personalization/.env


# ==============================================================================
# Services
# ==============================================================================

services:
  # ===========================================================================
  # FRONTEND
  # ===========================================================================
  frontend:
    build:
      context: ./srcs/frontend/
      dockerfile: Dockerfile
    image: front-react-ts
    container_name: frontend
    pull_policy: build
    # No published port:
    #  - Production Nginx listens on port 8080 inside its container and only the gateway reaches it.
    #  - see compose.override.yaml to get development port
    networks:
      - edge
    profiles:
      - frontend

  # ===========================================================================
  # API GATEWAY + REVERSE PROXY
  # ===========================================================================
  # The only container that publishes ports:
  # - 8080 redirects to HTTPS,
  # - 8443 serves the whole application (SPA and /api).
  # Its routes are an allowlist in srcs/gateway/dynamic/.
  # It has no Docker socket and is only on `edge`.
  gateway:
    image: docker.io/library/traefik:v3.7.11
    container_name: gateway
    restart: "always"
    profiles:
      - frontend
      - backend
    ports:
      - "${GATEWAY_PORT:?Variable not set}:8080"
      # Must stay equal to 8443: the HTTP to HTTPS redirect uses that port.
      - "${GATEWAY_HTTPS_PORT:?Variable not set}:8443"
    # Never mount /var/run/docker.sock here: the Docker API runs as root, so
    # access to it is root on the host, from the one container exposed to
    # the outside. Routes come from files (Traefik's file provider), not from
    # container labels, which would need the socket (ADR-0006).
    volumes:
      - ./srcs/gateway/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./srcs/gateway/dynamic:/etc/traefik/dynamic:ro
    secrets:
      - tls_certificate
      - tls_private_key
    networks:
      - edge
    # `make docker SERVICE=gateway` also starts the frontend, so the app opens
    # without the backend. Routes to a service that isn't running answer
    # 502 Bad Gateway.
    # required: false keeps the gateway usable when the frontend profile is off.
    depends_on:
      frontend:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # DATABASES
  # ===========================================================================

  pgsql:
    image: docker.io/library/postgres:18
    container_name: pgsql
    restart: "always"
    profiles:
      - databases
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - pgsql:${PGDATA:?Variable not set}
    environment:
      PGDATA: ${PGDATA:?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB_NAME:?Variable not set}
    secrets:
      - postgres_password
    networks:
      - backend

  pgvector:
    image: docker.io/pgvector/pgvector:pg18
    container_name: pgvector
    restart: "always"
    profiles:
      - databases
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - pgvector:${PGDATA:?Variable not set}
    environment:
      PGDATA: ${PGDATA:?Variable not set}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB_NAME:?Variable not set}
    secrets:
      - postgres_password
    networks:
      - backend

  # ===========================================================================
  # BACKEND
  # ===========================================================================

  # -- Ai-processing ----------------------------------------------------------
  # AI Processing uses pgvector, not pgsql. POSTGRES_PORT is the port inside
  # the backend network (5432), not the host port 5433: the service's settings
  # default to 5433 for `make run` on the host.
  prestart-ai-processing:
    <<: [*ai-processing-image-build, *backend-prestart]
    environment:
      POSTGRES_HOST: pgvector
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DEFAULT_DB_NAME: ${POSTGRES_DEFAULT_DB_NAME:?Variable not set}
    depends_on:
      pgvector:
        condition: service_healthy
    container_name: prestart-ai-processing

  ai-processing:
    <<: [*ai-processing-image-build, *backend-service]
    # Replaces the anchor's whole environment (YAML merge is not deep), so the
    # shared variables are repeated.
    environment:
      POSTGRES_HOST: pgvector
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_DEFAULT_DB_NAME: ${POSTGRES_DEFAULT_DB_NAME:?Variable not set}
    depends_on:
      pgvector:
        condition: service_healthy
      prestart-ai-processing:
        condition: service_completed_successfully

  # -- Content-management -----------------------------------------------------
  prestart-content-management:
    <<: [*content-management-image-build, *backend-prestart]
    container_name: prestart-content-management

  content-management:
    <<: [*content-management-image-build, *backend-service]
    depends_on:
      pgsql:
        condition: service_healthy
      prestart-content-management:
        condition: service_completed_successfully
    secrets:
      - news_api_key
      - postgres_password

  # -- Identity ---------------------------------------------------------------
  prestart-identity:
    <<: [*identity-image-build, *backend-prestart]
    container_name: prestart-identity

  identity:
    <<: [*identity-image-build, *backend-service]
    depends_on:
      pgsql:
        condition: service_healthy
      prestart-identity:
        condition: service_completed_successfully
    secrets:
      - jwt_private_key
      - jwt_public_key
      - postgres_password
      # One secret per service client: Identity compares what each client
      # sends with these (POST /internal/v1/oauth/token, ADR-0008). Each
      # client also gets its own secret, in the step that makes it a client.
      - personalization_client_secret
      - morning_briefing_client_secret
      - ai_processing_client_secret
    networks:
      - edge
      - backend

  # -- Morning-briefing -------------------------------------------------------
  prestart-morning-briefing:
    <<: [*morning-briefing-image-build, *backend-prestart]
    container_name: prestart-morning-briefing

  morning-briefing:
    <<: [*morning-briefing-image-build, *backend-service]
    environment:
      POSTGRES_HOST: pgsql
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_DEFAULT_DB_NAME: ${POSTGRES_DEFAULT_DB_NAME:?Variable not set}
      CONTENT_MANAGEMENT_URL: ${CONTENT_MANAGEMENT_INTERNAL_URL:?Variable not set}
      PERSONALIZATION_URL: ${PERSONALIZATION_INTERNAL_URL:?Variable not set}
    depends_on:
      pgsql:
        condition: service_healthy
      prestart-morning-briefing:
        condition: service_completed_successfully
    secrets:
      - jwt_public_key
      - postgres_password
    networks:
      - edge
      - backend

  # -- Personalization --------------------------------------------------------
  prestart-personalization:
    <<: [*personalization-image-build, *backend-prestart]
    container_name: prestart-personalization

  personalization:
    <<: [*personalization-image-build, *backend-service]
    # Replaces the anchor's whole environment (YAML merge is not deep), so the
    # shared variables are repeated.
    environment:
      POSTGRES_HOST: pgsql
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_DEFAULT_DB_NAME: ${POSTGRES_DEFAULT_DB_NAME:?Variable not set}
      CONTENT_MANAGEMENT_URL: ${CONTENT_MANAGEMENT_INTERNAL_URL:?Variable not set}
      IDENTITY_URL: ${IDENTITY_INTERNAL_URL:?Variable not set}
    depends_on:
      pgsql:
        condition: service_healthy
      prestart-personalization:
        condition: service_completed_successfully
    secrets:
      - jwt_public_key
      - postgres_password
      - personalization_client_secret
    networks:
      - edge
      - backend

  # ADMINISTRATION

secrets:
  postgres_password:
    file: ./shared/secrets/postgres_password
  jwt_private_key:
    file: ./shared/secrets/jwt_private_key
  jwt_public_key:
    file: ./shared/secrets/jwt_public_key
  news_api_key:
    file: ./shared/secrets/news_api_key
  tls_certificate:
    file: ./shared/secrets/certs/localhost.pem
  tls_private_key:
    file: ./shared/secrets/certs/localhost-key.pem
  personalization_client_secret:
    file: ./shared/secrets/services/personalization_client_secret
  morning_briefing_client_secret:
    file: ./shared/secrets/services/morning_briefing_client_secret
  ai_processing_client_secret:
    file: ./shared/secrets/services/ai_processing_client_secret

volumes:
  pgsql:
  pgvector:

networks:
  edge:
    name: ${DOMAIN}-edge
    driver: bridge
  backend:
    name: ${DOMAIN}-backend
    driver: bridge
